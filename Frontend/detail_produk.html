<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Detail Produk — AI Price Optimizer</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">Rp</div>
      Price Optimizer
    </div>
    <nav>
      <a href="index.html">Beranda</a>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="ai.html">Analisis AI</a>
      <a href="insight.html">Insight</a>
      <a href="tentang.html">Tentang</a>
    </nav>
    <div class="topbar-user">
      <button class="topbar-user-btn" id="userMenuBtn" type="button" aria-haspopup="true" aria-expanded="false">
        <div class="avatar">T</div>
        Tio
        <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="user-menu" id="userMenu">
        <div class="user-menu-info">
          <div class="user-menu-name">Tio</div>
          <div class="user-menu-role">Pemilik UMKM</div>
        </div>
        <button type="button" id="logoutBtn" class="danger">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <a href="dashboard.html" class="back-link">← Kembali ke Dashboard</a>

    <div class="detail-head">
      <div>
        <p class="eyebrow" id="d-kategori">Kategori</p>
        <h1 id="d-nama">Nama Produk</h1>
        <div class="detail-meta">
          <span>Toko: <b id="d-toko">—</b></span>
          <span>Lokasi: <b id="d-lokasi">—</b></span>
          <span id="d-rating">—</span>
          <span id="d-terjual">—</span>
        </div>
      </div>
      <div class="detail-price-box">
        <div class="value tabular" id="d-harga">—</div>
        <div class="market" id="d-harga-pasar">—</div>
      </div>
    </div>

    <div class="rec-note" style="margin-bottom:20px;" id="d-rekomendasi">—</div>

    <section class="main-grid">
      <div class="panel">
        <div class="panel-head">
          <h2>Riwayat Harga</h2>
          <span>5 minggu terakhir</span>
        </div>
        <div class="bars" id="history-bars"></div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <h2>Produk Serupa</h2>
        </div>
        <div id="d-serupa"></div>
      </div>
    </section>

    <section class="panel" style="margin-top:20px;">
      <div class="panel-head">
        <h2>Ulasan Pembeli</h2>
      </div>
      <div id="d-review"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/topbar.js"></script>
  <script src="js/detail_produk.js"></script>
</body>
</html>
